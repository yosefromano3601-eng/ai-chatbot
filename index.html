<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 70px;
            border-bottom: 1px solid #202833;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: #0f141b;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca6b3;
            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #35d07f;
            border-radius: 50%;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .welcome {
            max-width: 700px;
            margin: 70px auto 40px;
            text-align: center;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #8f9aaa;
            font-size: 18px;
            line-height: 1.6;
        }

        .messages {
            max-width: 800px;
            margin: auto;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.bot {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 16px;
        }

        .user .bubble {
            background: #1c2633;
            border-bottom-left-radius: 5px;
        }

        .bot .bubble {
            background: #151b24;
            border: 1px solid #252e3a;
            border-bottom-right-radius: 5px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 20px 22px;
            background: linear-gradient(
                transparent,
                #0b0f14 25%
            );
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            background: #151b23;
            border: 1px solid #303a47;
            border-radius: 18px;
            padding: 8px;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            min-height: 45px;
        }

        textarea::placeholder {
            color: #6f7a88;
        }

        button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: white;
            color: #0b0f14;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 16px;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">AI Chatbot</div>

        <div class="status">
            <span class="dot"></span>
            Online
        </div>
    </header>

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <h1>מה קורה?</h1>
            <p>
                אני כאן כדי לענות לך על שאלות.
                <br>
                וכן, כנראה שגם לשפוט אותך קצת.
            </p>
        </div>

        <div class="messages" id="messages"></div>

    </main>

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="כתוב הודעה..."
                rows="1"
            ></textarea>

            <button onclick="sendMessage()">↑</button>

        </div>

    </div>

</div>

<script>

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {

        const message = document.createElement("div");
        message.className = "message " + type;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        message.appendChild(bubble);
        messages.appendChild(message);

        document.getElementById("chat").scrollTop =
            document.getElementById("chat").scrollHeight;
    }

    function sendMessage() {

        const text = input.value.trim();

        if (!text) return;

        welcome.style.display = "none";

        addMessage(text, "user");

        input.value = "";

        setTimeout(() => {

            addMessage(
                "קיבלתי את ההודעה. כרגע אני עדיין בלי מוח אמיתי, כי עוד לא חיברנו אותי ל־AI. זה השלב הבא.",
                "bot"
            );

        }, 600);
    }

    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();
        }

    });

</script>

</body>
</html>
