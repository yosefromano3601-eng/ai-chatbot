<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top right, #18233d 0%, transparent 35%),
        radial-gradient(circle at bottom left, #111b30 0%, transparent 40%),
        #080b12;
    }

    header {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6c63ff, #00d4ff);
      font-size: 21px;
      box-shadow: 0 0 25px rgba(108,99,255,0.35);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #9ca3af;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35e88b;
      box-shadow: 0 0 10px #35e88b;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 130px;
    }

    .welcome {
      text-align: center;
      margin: 50px auto 35px;
      max-width: 500px;
    }

    .welcome-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #6c63ff, #00d4ff);
      box-shadow: 0 15px 50px rgba(0,212,255,0.15);
    }

    .welcome h1 {
      margin-top: 22px;
      font-size: 32px;
    }

    .welcome p {
      margin-top: 12px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .message {
      max-width: 850px;
      margin: 15px auto;
      display: flex;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.bot {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #5c54e8, #4c46bd);
      border-bottom-right-radius: 5px;
    }

    .bot .bubble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 5px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(
        transparent,
        rgba(8,11,18,0.95) 35%
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: rgba(20,25,38,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(20px);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      min-height: 45px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: #687083;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #6c63ff, #00bfe8);
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .typing {
      display: none;
      color: #9ca3af;
      font-size: 13px;
      max-width: 850px;
      margin: 10px auto;
    }

    @media (max-width: 600px) {
      .welcome {
        margin-top: 35px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">
        <div class="logo-icon">✦</div>
        <span>AI Chatbot</span>
      </div>

      <div class="status">
        <span class="dot"></span>
        Online
      </div>
    </header>

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h1>איך אפשר לעזור?</h1>
        <p>
          דבר איתי, שאל שאלות, תבקש רעיונות,
          או פשוט תבדוק אם אני באמת חכם כמו שאני טוען.
        </p>
      </div>

    </main>

    <div class="typing" id="typing">
      AI חושב...
    </div>

    <div class="input-area">
      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="כתוב הודעה..."
          rows="1"
        ></textarea>

        <button onclick="sendMessage()">➤</button>

      </div>
    </div>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const typing = document.getElementById("typing");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, type) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {

      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      typing.style.display = "block";

      setTimeout(() => {

        typing.style.display = "none";

        addMessage(
          "קיבלתי את ההודעה שלך. הממשק עובד. השלב הבא הוא לחבר אותי למודל AI אמיתי באמצעות API.",
          "bot"
        );

      }, 900);
    }

  </script>

</body>
</html>
